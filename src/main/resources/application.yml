spring:
  application:
    name: payment-transaction-hold-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_holds}
    username: ${DATABASE_USERNAME:payment}
    password: ${DATABASE_PASSWORD:payment}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
payment:
  hold:
    duration: ${PAYMENT_HOLD_DURATION:PT30M}
  outbox:
    poll-delay: ${PAYMENT_OUTBOX_POLL_DELAY:1000}
    max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:10}
  events:
    kafka:
      enabled: ${PAYMENT_KAFKA_ENABLED:false}
    topic: ${PAYMENT_EVENTS_TOPIC:payment.transaction.events}
    consumer-group: ${PAYMENT_EVENTS_CONSUMER_GROUP:payment-event-inbox}
server:
  error:
    include-message: never
    include-stacktrace: never
