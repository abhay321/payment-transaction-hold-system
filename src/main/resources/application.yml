spring:
  application:
    name: payment-transaction-hold-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_holds}
    username: ${DATABASE_USERNAME:payment}
    password: ${DATABASE_PASSWORD:payment}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
payment:
  hold:
    duration: ${PAYMENT_HOLD_DURATION:PT30M}
  outbox:
    poll-delay: ${PAYMENT_OUTBOX_POLL_DELAY:1000}
server:
  error:
    include-message: never
    include-stacktrace: never
